name: Security Assessment CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile backend
        run: |
          python -m compileall backend

      - name: Compile assessment scripts
        run: |
          python -m py_compile run_ai_assessment.py
          python -m py_compile run_assessment.py
          python -m py_compile test_ai_pipeline.py
          python -m py_compile test_dispatcher.py

      - name: Run dispatcher verification
        run: |
          python test_dispatcher.py