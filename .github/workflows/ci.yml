name: Security Assessment CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile backend
        run: |
          python -m compileall backend

      - name: Compile assessment scripts
        run: |
          python -m py_compile run_ai_assessment.py
          python -m py_compile run_assessment.py
          python -m py_compile test_ai_pipeline.py
          python -m py_compile test_dispatcher.py

      - name: Verify repository structure
        run: |
          test -f examples/crapi/crapi-openapi-spec.json
          test -f run_ai_assessment.py
          test -f run_assessment.py
          test -f test_ai_pipeline.py
          test -f test_dispatcher.py
          test -d backend/app/ai
          test -d backend/app/scanner
          test -d backend/app/validation
          test -d backend/app/reporting

      - name: Verify secret files are excluded
        run: |
          if git ls-files .env | grep -q .; then
            echo "ERROR: .env is tracked"
            exit 1
          fi

          if git grep -n -i "AIza" -- . ':!README.md'; then
            echo "ERROR: Possible Gemini API key found"
            exit 1
          fi

          if git grep -n -i "Bearer ey" -- . ':!README.md'; then
            echo "ERROR: Possible bearer token found"
            exit 1
          fi

          echo "Secret exposure checks passed."